<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Guts Answer Submission</title>
</head>
<body>
  <h2>Submit Answers</h2>

  <label>Team Name:</label><br>
  <input id="team" type="text"><br><br>

  <label>Question Number:</label><br>
  <input id="question" type="text"><br><br>

  <label>Your Answer:</label><br>
  <input id="answer" type="text"><br><br>

  <button onclick="submitAnswer()">Submit</button>

  <p id="result"></p>

<script>
function submitAnswer() {
  const team = document.getElementById("team").value.trim();
  const question = document.getElementById("question").value.trim();
  const answer = document.getElementById("answer").value.trim();

  if (!team || !question || !answer) {
    document.getElementById("result").innerText = "请把三个框都填上再点提交";
    return;
  }

  document.getElementById("result").innerText = "正在提交中...";

  const data = { team, question, answer };

  fetch("https://script.google.com/macros/s/AKfycbwy_eNr0cqopWP-3ZnC08m3PSGf9J0phf96YiSfddmFlcYnKKSePBTB_gs5YSD7qXPZ/exec", {
    method: "POST",
    // 注意：这里改成 text/plain，就不会触发 preflight 了
    headers: {
      "Content-Type": "text/plain;charset=utf-8"
    },
    body: JSON.stringify(data)
  })
  .then(res => res.text())
  .then(txt => {
    document.getElementById("result").innerText = "提交成功！";
    document.getElementById("answer").value = "";
  })
  .catch(err => {
    console.error(err);
    document.getElementById("result").innerText = "提交失败（请截图发给我）";
  });
}
</script>

</body>
</html>
